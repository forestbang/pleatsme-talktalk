<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>플리츠미 톡톡 · 관리자</title>
<style>
  :root{--green:#009e55;--navy:#1A365D;--gold:#ED9B33;--bg:#f4f7f5;--line:#e3e8e4;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--navy);line-height:1.6;padding-bottom:50px;}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}
  header{background:var(--navy);color:#fff;padding:20px 16px;text-align:center;}
  header h1{font-size:19px;font-weight:800;}
  header span{font-size:12.5px;opacity:.8;}

  /* 로그인 */
  .login{max-width:340px;margin:70px auto;background:#fff;padding:30px 26px;border-radius:18px;box-shadow:0 4px 20px rgba(26,54,93,.08);text-align:center;}
  .login .lk{width:52px;height:52px;margin:0 auto 14px;}
  .login h2{font-size:18px;margin-bottom:6px;}
  .login p{font-size:13px;color:#8a958d;margin-bottom:18px;}
  .login input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;text-align:center;letter-spacing:3px;}
  .login input:focus{outline:none;border-color:var(--green);}
  .login button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}

  /* 통계 */
  .stats{display:flex;gap:8px;margin:16px 0;}
  .stat{flex:1;background:#fff;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--line);}
  .stat b{display:block;font-size:22px;font-weight:800;}
  .stat span{font-size:11.5px;color:#8a958d;}
  .stat.g b{color:var(--gold);} .stat.n b{color:var(--navy);} .stat.gr b{color:var(--green);}

  /* 필터 */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .f{padding:7px 13px;border-radius:18px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:#6b756e;cursor:pointer;}
  .f.on{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* 카드 */
  .item{background:#fff;border-radius:14px;padding:16px 16px;margin-bottom:12px;border:1px solid var(--line);}
  .item.urg{border-color:var(--gold);border-width:2px;}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tag{padding:3px 10px;border-radius:14px;font-size:11.5px;font-weight:700;}
  .t-cat{background:#eef1f5;color:var(--navy);}
  .t-urg{background:#fef0da;color:var(--gold);}
  .t-consent{background:#eaf7f0;color:var(--green);}
  .t-code{background:var(--navy);color:#fff;letter-spacing:2px;}
  .date{font-size:11.5px;color:#a2aaa3;}
  .content{font-size:14px;white-space:pre-wrap;background:#fafbfa;border-radius:10px;padding:12px 14px;margin:6px 0 12px;}
  .sel{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--navy);}
  .replybox{margin-top:10px;}
  .replybox textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:13.5px;font-family:inherit;min-height:70px;resize:vertical;}
  .replybox textarea:focus{outline:none;border-color:var(--green);}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .save{padding:9px 18px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
  .saved{font-size:12.5px;color:var(--green);font-weight:700;}
  .empty{text-align:center;color:#98a29a;padding:50px 0;font-size:14px;}
  .hide{display:none;}
</style>
</head>
<body>

<div id="loginView">
  <div class="login">
    <svg class="lk" viewBox="0 0 48 48" fill="none">
      <rect x="10" y="21" width="28" height="20" rx="4" fill="#1A365D"/>
      <path d="M16 21v-5a8 8 0 0116 0v5" stroke="#1A365D" stroke-width="3.5" fill="none"/>
      <circle cx="24" cy="30" r="3" fill="#ED9B33"/>
    </svg>
    <h2>관리자 로그인</h2>
    <p>담당 부장 전용 화면입니다</p>
    <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">들어가기</button>
  </div>
</div>

<div id="mainView" class="hide">
  <header>
    <h1>🌿 플리츠미 톡톡 관리자</h1>
    <span>해피미 케어센터 · 이미옥 · 이경춘 부장</span>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <div class="f on" data-f="all">전체</div>
      <div class="f" data-f="urgent">⚡ 긴급</div>
      <div class="f" data-f="접수">접수</div>
      <div class="f" data-f="처리중">처리중</div>
      <div class="f" data-f="완료">완료</div>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ===== Firebase 설정 (입력 완료) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAbXALdHB0Fe5o-5gsySde-MpnF5vHZoTo",
  authDomain: "pleatsme-talktalk.firebaseapp.com",
  databaseURL: "https://pleatsme-talktalk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pleatsme-talktalk",
  storageBucket: "pleatsme-talktalk.firebasestorage.app",
  messagingSenderId: "30236277906",
  appId: "1:30236277906:web:6c4365e10b486860e13a4b"
};
/* ===== 🔑 관리자 비밀번호 (원하는 값으로 바꾸세요) ===== */
const ADMIN_PW = "happyme2026";
/* ========================================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let allPosts=[], curFilter='all';

function login(){
  if(document.getElementById('pw').value===ADMIN_PW){
    document.getElementById('loginView').classList.add('hide');
    document.getElementById('mainView').classList.remove('hide');
    loadPosts();
  }else{ alert('비밀번호가 올바르지 않습니다.'); }
}

function loadPosts(){
  db.ref('posts').on('value',snap=>{
    const v=snap.val()||{};
    allPosts=Object.entries(v).map(([code,d])=>({code,...d}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    render();
  });
}

document.querySelectorAll('.f').forEach(f=>{
  f.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));f.classList.add('on');curFilter=f.dataset.f;render();};
});

function render(){
  const total=allPosts.length;
  const urg=allPosts.filter(p=>p.urgent).length;
  const wait=allPosts.filter(p=>p.status==='접수').length;
  document.getElementById('stats').innerHTML=
    `<div class="stat n"><b>${total}</b><span>전체</span></div>
     <div class="stat g"><b>${urg}</b><span>긴급</span></div>
     <div class="stat gr"><b>${wait}</b><span>미처리</span></div>`;

  let list=allPosts;
  if(curFilter==='urgent') list=list.filter(p=>p.urgent);
  else if(curFilter!=='all') list=list.filter(p=>p.status===curFilter);

  const box=document.getElementById('list');
  if(!list.length){ box.innerHTML='<div class="empty">해당하는 제보가 없습니다.</div>'; return; }

  box.innerHTML=list.map(p=>{
    const d=new Date(p.createdAt||0);
    const ds=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return `<div class="item ${p.urgent?'urg':''}">
      <div class="top">
        <div class="badges">
          <span class="tag t-code">${p.code}</span>
          <span class="tag t-cat">${p.category||'기타'}</span>
          ${p.urgent?'<span class="tag t-urg">⚡ 긴급</span>':''}
          ${p.consent?'<span class="tag t-consent">공개동의</span>':''}
        </div>
        <span class="date">${ds}</span>
      </div>
      <div class="content">${esc(p.content)}</div>
      <div class="row">
        <select class="sel" id="st_${p.code}">
          ${opt('접수',p.status)}${opt('처리중',p.status)}${opt('완료',p.status)}
        </select>
        <span style="font-size:12.5px;color:#8a958d;">상태 변경 후 저장</span>
      </div>
      <div class="replybox">
        <textarea id="rp_${p.code}" placeholder="직원에게 전할 답변을 적으세요 (직원은 익명 유지한 채 확인합니다)">${p.reply||''}</textarea>
        <div class="row">
          <button class="save" onclick="save('${p.code}')">저장</button>
          <span class="saved hide" id="sv_${p.code}">✔ 저장됨</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function opt(v,cur){return `<option value="${v}" ${v===cur?'selected':''}>${v}</option>`;}
function pad(n){return String(n).padStart(2,'0');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function save(code){
  const status=document.getElementById('st_'+code).value;
  const reply=document.getElementById('rp_'+code).value;
  await db.ref('posts/'+code).update({status,reply});
  const s=document.getElementById('sv_'+code);
  s.classList.remove('hide'); setTimeout(()=>s.classList.add('hide'),1800);
}
</script>
</body>
</html>
